<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#0B1F3A">
    <title>Ingresar | FitLife</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <script src="/config.js" defer></script>
</head>
<body data-page="login" class="auth-page">
    <main class="container auth-layout d-flex align-items-center justify-content-center py-5">
        <div class="col-12 col-md-7 col-lg-5">
            <div class="card border-0 shadow-lg auth-card">
                <div class="card-body p-4 p-sm-5">
                    <div class="text-center mb-4">
                        <a class="brand-mark brand-mark-lg mx-auto" href="index.html" aria-label="FitLife"></a>
                        <p class="eyebrow mt-3 mb-2">Centro deportivo</p>
                        <h1 class="h3 fw-bold mb-2">Bienvenido a FitLife</h1>
                        <p class="text-muted mb-0">Ingresa para gestionar tu entrenamiento.</p>
                    </div>
                    <div id="page-alert" class="alert alert-danger shadow-sm" role="alert" aria-live="polite" hidden></div>
                    <form id="login-form" novalidate>
                        <div class="mb-3">
                            <label class="form-label fw-semibold" for="username">Usuario</label>
                            <input class="form-control form-control-lg" id="username" name="username" type="text" autocomplete="username" required>
                        </div>
                        <div class="mb-4">
                            <label class="form-label fw-semibold" for="password">Contraseña</label>
                            <input class="form-control form-control-lg" id="password" name="password" type="password" autocomplete="current-password" required>
                        </div>
                        <button class="btn btn-primary btn-lg w-100" id="login-submit" type="submit">Ingresar al panel</button>
                    </form>
                </div>
            </div>
        </div>
    </main>
</body>
</html>
